<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>emotion_favour · 印象管理台</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // 防止浅色主题闪烁（FOUC）：AstrBot 主 webui 注入 localStorage 主题
    (function () {
      try {
        var t = localStorage.getItem('astrbot-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-title">
        <span class="title-icon">💖</span>
        <span>印象管理台</span>
        <span class="version-tag" id="version-tag">—</span>
      </div>
      <div class="topbar-actions">
        <div class="persona-switcher" id="persona-switcher" hidden>
          <label for="persona-select">人格</label>
          <input id="persona-select" type="search" list="persona-options" placeholder="搜索人格" autocomplete="off">
          <datalist id="persona-options"></datalist>
        </div>
        <button class="btn btn-ghost btn-sm" id="create-btn" title="新增好感记录">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button class="btn btn-ghost btn-sm" id="theme-toggle" title="切换主题">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="btn btn-ghost btn-sm" id="refresh-btn" title="刷新">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="content">
      <div class="stats-bar">
        <span class="stat-item">人格：<strong id="persona-tag">—</strong></span>
        <span class="stat-item">共 <strong id="user-count">0</strong> 位用户</span>
        <span class="stat-item">好感度范围：<strong id="range-tag">—</strong></span>
        <span class="stat-item" id="mode-tag" hidden>关系模式：<strong id="mode-value">—</strong></span>
        <span class="sort-bar">
          <span class="sort-label">排序：</span>
          <button class="sort-chip" data-key="user_id">用户 ID</button>
          <button class="sort-chip active" data-key="favour">好感度</button>
          <button class="sort-chip" data-key="updated_at">修改时间</button>
        </span>
      </div>

      <div class="records-toolbar">
        <label for="user-search">用户 ID</label>
        <input id="user-search" type="search" placeholder="搜索全部记录" autocomplete="off">
        <button class="btn btn-secondary btn-sm" id="clear-search" type="button" hidden>清除</button>
      </div>

      <div id="records-list" class="records-list">
        <div class="loading-wrap"><span class="spinner"></span> 加载中...</div>
      </div>

      <div id="pager" class="pager" hidden>
        <button class="btn btn-secondary btn-sm" id="page-prev" type="button">上一页</button>
        <span id="page-info">第 1 / 1 页</span>
        <button class="btn btn-secondary btn-sm" id="page-next" type="button">下一页</button>
        <label for="page-size">每页</label>
        <select id="page-size">
          <option value="20">20</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="200">200</option>
        </select>
        <label for="page-jump">跳至</label>
        <input id="page-jump" type="number" min="1" value="1">
        <button class="btn btn-secondary btn-sm" id="page-jump-btn" type="button">跳转</button>
      </div>

      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-icon">📭</div>
        <div>当前人格下暂无印象记录</div>
      </div>

      <div id="error-state" class="error-state" hidden>
        <div class="error-icon">⚠️</div>
        <div id="error-msg">加载失败</div>
      </div>
    </main>

    <div id="toast" class="toast" hidden></div>
  </div>

  <!-- ===== 编辑 Dialog（单例，运行时填充） ===== -->
  <dialog id="edit-dialog" class="dialog">
    <div class="dialog-header">
      <div class="dialog-title">
        <span class="user-id" id="edit-user-id">—</span>
        <span class="admin-tag" id="edit-admin-tag" hidden>特殊关系</span>
      </div>
      <button class="dialog-close" id="edit-close" type="button" aria-label="关闭">×</button>
    </div>
    <div class="dialog-body">
      <div class="favour-control">
        <label>当前有效好感</label>
        <input type="number" class="favour-input" id="edit-favour">
        <span class="relationship-tag" id="edit-relationship">—</span>
        <span class="range-tag" id="edit-range"></span>
        <span class="stored-favour-note" id="edit-stored-favour"></span>
      </div>
      <div class="emotion-grid" id="edit-emotion-grid"></div>
    </div>
    <div class="dialog-footer">
      <span class="updated-at" id="edit-updated-at">—</span>
      <div class="action-buttons">
        <button class="btn btn-secondary btn-sm" id="edit-zero-emotions" type="button">情感归零</button>
        <button class="btn btn-secondary btn-sm" id="edit-restore" type="button">恢复原值</button>
        <button class="btn btn-secondary btn-sm" id="edit-discard" type="button">放弃</button>
        <button class="btn btn-success btn-sm" id="edit-confirm" type="button">✓ 确认</button>
      </div>
    </div>
  </dialog>

  <!-- ===== 新增 Dialog ===== -->
  <dialog id="create-dialog" class="dialog">
    <div class="dialog-header">
      <div class="dialog-title">新增好感记录</div>
      <button class="dialog-close" id="create-close" type="button" aria-label="关闭">×</button>
    </div>
    <div class="dialog-body">
      <div class="form-row">
        <label for="create-user-id">QQ / user_id</label>
        <input type="text" id="create-user-id" placeholder="用户 QQ 号" autocomplete="off">
      </div>
      <div class="form-row">
        <label for="create-persona">人格</label>
        <input id="create-persona" type="search" list="create-persona-options" placeholder="搜索人格" autocomplete="off">
        <datalist id="create-persona-options"></datalist>
      </div>
      <div class="form-row">
        <label for="create-favour">好感度</label>
        <input type="number" class="favour-input" id="create-favour" value="0">
        <span class="relationship-tag" id="create-relationship">—</span>
      </div>
      <details class="emotions-collapse">
        <summary>情感（可选，默认全 0）</summary>
        <div class="emotion-grid" id="create-emotion-grid"></div>
      </details>
    </div>
    <div class="dialog-footer">
      <span></span>
      <div class="action-buttons">
        <button class="btn btn-secondary btn-sm" id="create-cancel" type="button">取消</button>
        <button class="btn btn-success btn-sm" id="create-submit" type="button">创建</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
