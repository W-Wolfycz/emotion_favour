<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>emotion_favour · 印象管理台</title>
  <link rel="stylesheet" href="style.css?v=3.4.3-r6">
  <script>
    // 防止浅色主题闪烁（FOUC）：AstrBot 主 webui 注入 localStorage 主题
    (function () {
      try {
        var t = localStorage.getItem('astrbot-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-title">
        <span class="title-icon">💖</span>
        <span>印象管理台</span>
        <span class="version-tag" id="version-tag">—</span>
      </div>
      <div class="topbar-actions">
        <div class="persona-switcher" id="persona-switcher" hidden>
          <label for="persona-select">人格</label>
          <div class="persona-combobox">
            <input id="persona-select" type="search" placeholder="搜索人格" autocomplete="off"
                   role="combobox" aria-autocomplete="list" aria-controls="persona-menu" aria-expanded="false">
            <div id="persona-menu" class="persona-menu" role="listbox" hidden></div>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" id="backup-btn" title="备份与恢复">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <ellipse cx="12" cy="5" rx="7" ry="3"/>
            <path d="M5 5v6c0 1.7 3.1 3 7 3 1.1 0 2.2-.1 3.1-.3"/>
            <path d="M5 11v6c0 1.7 3.1 3 7 3"/>
            <path d="M19 5v5"/>
            <path d="m16 19 2 2 4-4"/>
          </svg>
        </button>
        <button class="btn btn-ghost btn-sm" id="create-btn" title="新增好感记录">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button class="btn btn-ghost btn-sm" id="theme-toggle" title="切换主题">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="btn btn-ghost btn-sm" id="refresh-btn" title="刷新">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="content">
      <div class="stats-bar">
        <span class="stat-item">人格：<strong id="persona-tag">—</strong></span>
        <span class="stat-item">共 <strong id="user-count">0</strong> 位用户</span>
        <span class="stat-item">好感度范围：<strong id="range-tag">—</strong></span>
        <span class="stat-item" id="mode-tag" hidden>关系模式：<strong id="mode-value">—</strong></span>
        <span class="sort-bar">
          <span class="sort-label">排序：</span>
          <button class="sort-chip" data-key="user_id">用户 ID</button>
          <button class="sort-chip active" data-key="favour">好感度</button>
          <button class="sort-chip" data-key="updated_at">修改时间</button>
        </span>
      </div>

      <div class="records-toolbar">
        <label for="user-search">用户 ID</label>
        <input id="user-search" type="search" placeholder="搜索全部记录" autocomplete="off">
        <button class="btn btn-secondary btn-sm" id="clear-search" type="button" hidden>清除</button>
      </div>

      <div id="records-list" class="records-list">
        <div class="loading-wrap"><span class="spinner"></span> 加载中...</div>
      </div>

      <div id="pager" class="pager" hidden>
        <button class="btn btn-secondary btn-sm" id="page-prev" type="button">上一页</button>
        <span id="page-info">第 1 / 1 页</span>
        <button class="btn btn-secondary btn-sm" id="page-next" type="button">下一页</button>
        <label for="page-size">每页</label>
        <select id="page-size">
          <option value="20">20</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="200">200</option>
        </select>
        <label for="page-jump">跳至</label>
        <input id="page-jump" type="number" min="1" value="1">
        <button class="btn btn-secondary btn-sm" id="page-jump-btn" type="button">跳转</button>
      </div>

      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-icon">📭</div>
        <div>当前人格下暂无印象记录</div>
      </div>

      <div id="error-state" class="error-state" hidden>
        <div class="error-icon">⚠️</div>
        <div id="error-msg">加载失败</div>
      </div>
    </main>

    <div id="toast" class="toast" hidden></div>
  </div>

  <!-- ===== 编辑 Dialog（单例，运行时填充） ===== -->
  <dialog id="edit-dialog" class="dialog">
    <div class="dialog-header">
      <div class="dialog-title">
        <span class="user-id" id="edit-user-id">—</span>
        <span class="admin-tag" id="edit-admin-tag" hidden>特殊关系</span>
      </div>
      <button class="dialog-close" id="edit-close" type="button" aria-label="关闭">×</button>
    </div>
    <div class="dialog-body">
      <div class="favour-control">
        <label>当前有效好感</label>
        <input type="number" class="favour-input" id="edit-favour">
        <span class="relationship-tag" id="edit-relationship">—</span>
        <span class="range-tag" id="edit-range"></span>
        <span class="stored-favour-note" id="edit-stored-favour"></span>
      </div>
      <div class="emotion-grid" id="edit-emotion-grid"></div>
    </div>
    <div class="dialog-footer">
      <span class="updated-at" id="edit-updated-at">—</span>
      <div class="action-buttons">
        <button class="btn btn-secondary btn-sm" id="edit-zero-emotions" type="button">情感归零</button>
        <button class="btn btn-secondary btn-sm" id="edit-restore" type="button">恢复原值</button>
        <button class="btn btn-secondary btn-sm" id="edit-discard" type="button">放弃</button>
        <button class="btn btn-success btn-sm" id="edit-confirm" type="button">✓ 确认</button>
      </div>
    </div>
  </dialog>

  <!-- ===== 新增 Dialog ===== -->
  <dialog id="create-dialog" class="dialog">
    <div class="dialog-header">
      <div class="dialog-title">新增好感记录</div>
      <button class="dialog-close" id="create-close" type="button" aria-label="关闭">×</button>
    </div>
    <div class="dialog-body">
      <div class="form-row">
        <label for="create-user-id">QQ / user_id</label>
        <input type="text" id="create-user-id" placeholder="用户 QQ 号" autocomplete="off">
      </div>
      <div class="form-row">
        <label for="create-persona">人格</label>
        <div class="persona-combobox">
          <input id="create-persona" type="search" placeholder="搜索人格" autocomplete="off"
                 role="combobox" aria-autocomplete="list" aria-controls="create-persona-menu" aria-expanded="false">
          <div id="create-persona-menu" class="persona-menu" role="listbox" hidden></div>
        </div>
      </div>
      <div class="form-row">
        <label for="create-favour">好感度</label>
        <input type="number" class="favour-input" id="create-favour" value="0">
        <span class="relationship-tag" id="create-relationship">—</span>
      </div>
      <details class="emotions-collapse">
        <summary>情感（可选，默认全 0）</summary>
        <div class="emotion-grid" id="create-emotion-grid"></div>
      </details>
    </div>
    <div class="dialog-footer">
      <span></span>
      <div class="action-buttons">
        <button class="btn btn-secondary btn-sm" id="create-cancel" type="button">取消</button>
        <button class="btn btn-success btn-sm" id="create-submit" type="button">创建</button>
      </div>
    </div>
  </dialog>

  <!-- ===== 备份与恢复 Dialog ===== -->
  <dialog id="backup-dialog" class="dialog backup-dialog">
    <div class="dialog-header">
      <div class="dialog-title">备份与恢复 · <span id="backup-persona">—</span></div>
      <button class="dialog-close" id="backup-close" type="button" aria-label="关闭">×</button>
    </div>
    <div class="dialog-body">
      <div class="backup-toolbar">
        <span id="backup-summary">—</span>
        <button class="btn btn-success btn-sm" id="backup-create" type="button">创建备份</button>
      </div>
      <div id="backup-result" class="backup-result" hidden></div>
      <div id="backup-list" class="backup-list">
        <div class="loading-wrap"><span class="spinner"></span> 加载中...</div>
      </div>
    </div>
    <div class="dialog-footer">
      <span class="backup-footnote">恢复会覆盖备份中的同名用户，其他记录保持不变。</span>
      <div class="action-buttons">
        <button class="btn btn-secondary btn-sm" id="backup-done" type="button">关闭</button>
      </div>
    </div>
  </dialog>

  <!-- ===== 页面内确认 Dialog（iframe sandbox 不允许原生 confirm） ===== -->
  <dialog id="confirm-dialog" class="dialog confirm-dialog">
    <div class="dialog-header">
      <div class="dialog-title" id="confirm-title">确认操作</div>
    </div>
    <div class="dialog-body">
      <div id="confirm-message" class="confirm-message"></div>
    </div>
    <div class="dialog-footer">
      <span></span>
      <div class="action-buttons">
        <button class="btn btn-secondary btn-sm" id="confirm-cancel" type="button">取消</button>
        <button class="btn btn-success btn-sm" id="confirm-submit" type="button">确认</button>
      </div>
    </div>
  </dialog>

  <script src="persona_logic.js?v=3.4.3-r6"></script>
  <script src="app.js?v=3.4.3-r6"></script>
</body>
</html>
